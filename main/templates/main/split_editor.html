{% extends 'main/base.html' %}
{% load static %}

{% block title %}Editing: {{ form.title }} | Markdown Notes{% endblock %}

{% block content %}
<div class="editor-layout animate-fade-in" style="height: calc(100vh - 4rem); display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <a href="{% url 'note_view' form.id %}" class="btn btn-outline" style="padding: 0.5rem;"><i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i></a>
            <div>
                <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Editing Note</div>
                <div style="font-weight: 700;">{{ form.title }}</div>
            </div>
        </div>
        <div style="display: flex; gap: 0.75rem; align-items: center;">
            <span style="font-size: 0.75rem; color: var(--success); font-weight: 600; display: flex; align-items: center; gap: 0.25rem;">
                <i data-lucide="check-circle" style="width: 14px; height: 14px;"></i> Saved
            </span>
            <div style="display: flex; background: var(--sidebar-active); border-radius: 8px; padding: 2px;">
                <button class="btn btn-outline" style="padding: 0.4rem 0.8rem; border: none; background: white; box-shadow: var(--shadow-sm);"><i data-lucide="columns" style="width: 16px; height: 16px;"></i></button>
                <button class="btn" style="padding: 0.4rem 0.8rem; border: none; background: transparent;"><i data-lucide="eye" style="width: 16px; height: 16px;"></i></button>
                <button class="btn" style="padding: 0.4rem 0.8rem; border: none; background: transparent;"><i data-lucide="maximize-2" style="width: 16px; height: 16px;"></i></button>
            </div>
            <button type="submit" form="edit-form" class="btn btn-primary">Save Changes</button>
        </div>
    </div>

    <div class="editor-panes" style="flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; overflow: hidden;">
        <div class="card" style="display: flex; flex-direction: column; padding: 0; overflow: hidden;">
            <div style="padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fafafa;">
                <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Markdown Editor</span>
                <div style="display: flex; gap: 0.5rem;">
                    <i data-lucide="bold" style="width: 16px; height: 16px; cursor: pointer;"></i>
                    <i data-lucide="italic" style="width: 16px; height: 16px; cursor: pointer;"></i>
                    <i data-lucide="link" style="width: 16px; height: 16px; cursor: pointer;"></i>
                    <i data-lucide="image" style="width: 16px; height: 16px; cursor: pointer;"></i>
                    <i data-lucide="list" style="width: 16px; height: 16px; cursor: pointer;"></i>
                </div>
            </div>
            <form id="edit-form" method="POST" style="flex: 1; display: flex; flex-direction: column;">
                {% csrf_token %}
                <input type="text" name="title" value="{{ form.title }}" style="border: none; border-bottom: 1px solid var(--border); border-radius: 0; padding: 1.5rem; font-size: 1.5rem; font-weight: 700; font-family: 'Outfit', sans-serif;" placeholder="Title">
                <textarea name="content" style="flex: 1; border: none; border-radius: 0; padding: 1.5rem; font-family: 'Fira Code', monospace; font-size: 0.9rem; line-height: 1.6; resize: none;" oninput="updatePreview(this.value)">{{ form.content }}</textarea>
            </form>
        </div>

        <div class="card" style="display: flex; flex-direction: column; padding: 0; overflow: hidden;">
            <div style="padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--border); background: #fafafa;">
                <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Live Preview</span>
            </div>
            <div id="preview-pane" style="flex: 1; padding: 2rem; overflow-y: auto; background: white;">
                <h1 id="preview-title" style="font-size: 2rem; font-weight: 800; margin-bottom: 1rem; font-family: 'Outfit', sans-serif;">{{ form.title }}</h1>
                <div id="preview-content" style="font-size: 1rem; line-height: 1.6;">
                    {{ form.content|linebreaksbr }}
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function updatePreview(val) {
        const previewContent = document.getElementById('preview-content');
        if (typeof marked !== 'undefined') {
            previewContent.innerHTML = marked.parse(val);
        } else {
            previewContent.innerText = val;
        }
    }
    
    // Initial preview
    window.addEventListener('DOMContentLoaded', () => {
        const textarea = document.querySelector('textarea[name="content"]');
        if (textarea) updatePreview(textarea.value);
    });
</script>

<style>
    .main-content { padding-bottom: 0 !important; }
</style>
{% endblock %}
