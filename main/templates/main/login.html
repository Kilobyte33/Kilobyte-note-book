{% extends 'main/base.html' %}
{% load static %}

{% block title %}Login | Kilobyte Note Book{% endblock %}

{% block auth_content %}
<div class="auth-container">
    <div class="auth-card card animate-fade-in">
        <div class="auth-header">
            <div class="logo-icon mx-auto" style="margin: 5px auto 1rem;">K</div>
            <h2 class="auth-title">Welcome back</h2>
            <p class="auth-subtitle">Login to continue to your notes</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete ="off">
            </div>
            
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                    <a href="#" style="font-size: 0.75rem; color: var(--primary); text-decoration: none; font-weight: 600;">Forgot?</a>
                </div>
                <input type="password" id="password" name="password" placeholder="Enter your password" required style="margin-top: 0.5rem;" autocomplete ="off">
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: -0.5rem;">
                <input type="checkbox" id="remember" style="width: auto;">
                <label for="remember" style="margin-bottom: 0; font-weight: 500; font-size: 0.75rem; color: var(--text-muted);">Remember me</label>
            </div>

            <button type="submit" class="btn btn-primary w-100" style="justify-content: center; padding: 0.75rem;">Login</button>
        </form>

        <div class="auth-divider">
            <span>or</span>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
            Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign up</a>
        </div>
    </div>
</div>

<style>
    .mx-auto { margin-left: auto; margin-right: auto; }
    .w-100 { width: 100%; }
</style>
{% endblock %}

{% block extra_head %}
<script>
    
    window.hide_sidebar = true;
</script>
{% endblock %}
